version: '3'
services:
  test:
    image: $IMAGE_NAME
    build:
      dockerfile: ${TEST_DOCKERFILE:-Dockerfile.test}
      context: ./
      args:
        - VERSION=$VERSION
        - IMAGE=$IMAGE
        - DOCKER_ID_USER=$DOCKER_ID_USER
        - USER_NAME=$USER_NAME
    command: /home/test/test.sh

