version: 2.1

jobs:
  release:
    parameters:
      image:
        type: string
    machine: true
    steps:
      - checkout
      - run:
          name: Set up QEMU
          command: docker run --privileged --rm tonistiigi/binfmt --install all
      - run:
          name: Set up buildx
          command: docker buildx create --use
      - run:
          name: Release
          command: bin/image.sh push << parameters.image >>

workflows:
  release:
    jobs:
      # ── Tools ──────────────────────────────────────────────────────────────
      - release:
          name: release-fly
          image: fly
          filters: &tag_only
            tags:
              only: /.*/
            branches:
              ignore: /.*/

      - release:
          name: release-scripts
          image: scripts
          filters: *tag_only

      - release:
          name: release-heroku
          image: heroku
          filters: *tag_only

      # ── Development ────────────────────────────────────────────────────────
      - release:
          name: release-ruby_331
          image: ruby_331
          requires: [release-scripts]
          filters: *tag_only

      - release:
          name: release-ruby_base
          image: ruby_base
          filters: *tag_only

      - release:
          name: release-ruby_node
          image: ruby_node
          requires: [release-ruby_331]
          filters: *tag_only

      - release:
          name: release-node
          image: node
          requires: [release-scripts]
          filters: *tag_only

      - release:
          name: release-node_mongo
          image: node_mongo
          requires: [release-node]
          filters: *tag_only

      - release:
          name: release-python_37
          image: python_37
          filters: *tag_only

      - release:
          name: release-rails_yarn
          image: rails_yarn
          requires: [release-scripts, release-ruby_331]
          filters: *tag_only

      - release:
          name: release-rails_gems
          image: rails_gems
          requires: [release-scripts, release-ruby_331]
          filters: *tag_only

      - release:
          name: release-rails_bower
          image: rails_bower
          requires: [release-scripts, release-ruby_node]
          filters: *tag_only

      - release:
          name: release-django
          image: django
          requires: [release-scripts]
          filters: *tag_only

      - release:
          name: release-taa
          image: taa
          requires: [release-scripts, release-rails_yarn]
          filters: *tag_only

      - release:
          name: release-taap
          image: taap
          requires: [release-scripts, release-taa]
          filters: *tag_only

      # ── CircleCI ───────────────────────────────────────────────────────────
      - release:
          name: release-circleci_ruby_331
          image: circleci_ruby_331
          requires: [release-scripts]
          filters: *tag_only

      - release:
          name: release-circleci_ruby_node
          image: circleci_ruby_node
          requires: [release-circleci_ruby_331]
          filters: *tag_only

      - release:
          name: release-circleci_node
          image: circleci_node
          requires: [release-scripts]
          filters: *tag_only

      - release:
          name: release-circleci_node_mongo
          image: circleci_node_mongo
          requires: [release-circleci_node]
          filters: *tag_only

      - release:
          name: release-circleci_python_37
          image: circleci_python_37
          filters: *tag_only

      - release:
          name: release-circleci_rails_yarn
          image: circleci_rails_yarn
          requires: [release-scripts, release-circleci_ruby_331]
          filters: *tag_only

      - release:
          name: release-circleci_rails_gems
          image: circleci_rails_gems
          requires: [release-scripts, release-circleci_ruby_331]
          filters: *tag_only

      - release:
          name: release-circleci_rails_bower
          image: circleci_rails_bower
          requires: [release-scripts, release-circleci_ruby_node]
          filters: *tag_only

      - release:
          name: release-circleci_django
          image: circleci_django
          requires: [release-scripts]
          filters: *tag_only

      - release:
          name: release-circleci_taa
          image: circleci_taa
          requires: [release-scripts, release-circleci_rails_yarn]
          filters: *tag_only

      - release:
          name: release-circleci_taap
          image: circleci_taap
          requires: [release-scripts, release-circleci_taa]
          filters: *tag_only

      # ── Production ─────────────────────────────────────────────────────────
      - release:
          name: release-production_ruby_331
          image: production_ruby_331
          requires: [release-scripts]
          filters: *tag_only

      - release:
          name: release-production_ruby_node
          image: production_ruby_node
          requires: [release-production_ruby_331]
          filters: *tag_only

      - release:
          name: release-production_django
          image: production_django
          requires: [release-scripts]
          filters: *tag_only

      - release:
          name: release-production_rails_yarn
          image: production_rails_yarn
          requires: [release-scripts, release-ruby_331]
          filters: *tag_only

      - release:
          name: release-production_rails_bower
          image: production_rails_bower
          requires: [release-scripts, release-production_ruby_node]
          filters: *tag_only

      - release:
          name: release-production_taa
          image: production_taa
          requires: [release-scripts, release-production_rails_yarn]
          filters: *tag_only

      - release:
          name: release-production_taap
          image: production_taap
          requires: [release-scripts, release-production_taa]
          filters: *tag_only
