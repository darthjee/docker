version: 2.1

jobs:
  release:
    parameters:
      image:
        type: string
      arch:
        type: string
        default: ""
    machine: true
    steps:
      - checkout
      - run:
          name: Set up QEMU
          command: docker run --privileged --rm tonistiigi/binfmt --install all
      - run:
          name: Docker login
          command: echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
      - run:
          name: Release
          command: DOCKER_ID_USER=$DOCKER_HUB_USERNAME bin/image.sh push << parameters.image >> << parameters.arch >>

workflows:
  release:
    jobs:
      # ── Tools ──────────────────────────────────────────────────────────────
      - release:
          name: release-fly
          image: fly
          filters: &tag_only
            tags:
              only: /.*/
            branches:
              ignore: /.*/
      - release:
          name: release-fly-arm64
          image: fly
          arch: arm64
          filters: *tag_only

      - release:
          name: release-scripts
          image: scripts
          filters: *tag_only
      - release:
          name: release-scripts-arm64
          image: scripts
          arch: arm64
          filters: *tag_only

      - release:
          name: release-heroku
          image: heroku
          filters: *tag_only
      - release:
          name: release-heroku-arm64
          image: heroku
          arch: arm64
          filters: *tag_only

      # ── Development ────────────────────────────────────────────────────────
