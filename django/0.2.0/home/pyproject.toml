[tool.poetry]
name = "Django Image"
version = "0.0.1"
description = "Django Image Project"
authors = [ "Darthjee" ]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.12"
django = "5.2.19"
django-admin = "2.0.2"
mysqlclient = "2.3.0"
gunicorn = "26.2.0"
jinja2 = "^3.1.6"

[tool.poetry.group.dev.dependencies]
pytest = "9.2.0"
pytest-django = "4.14.0"
ruff = "0.17.4"
radon = "^6.0.1"
xenon = "^0.9.3"
lizard = "^1.25.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
